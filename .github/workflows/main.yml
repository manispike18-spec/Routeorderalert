name: Build Route Alert APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q RouteOrderAlertAndroid_Source.zip -d source

      - name: Locate Android project
        run: |
          PROJECT_FILE=$(find source -type f -path '*/app/build.gradle' | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found."
            echo "Checking extracted files:"
            find source -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RouteAlert-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
